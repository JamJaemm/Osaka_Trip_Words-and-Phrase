<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>일본 여행 필수 회화</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f0;--bg2:#ffffff;--bg3:#f0f0eb;--border:#e0ddd6;--text:#1a1a1a;--muted:#888;--accent:#b8860b;--green:#2d8a5e;--red:#c0392b;--blue:#2563a8;--purple:#6b46c1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR",sans-serif;font-weight:300;line-height:1.6;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:80px}

/* HERO */
.hero{padding:44px 20px 28px;background:linear-gradient(160deg,#fafaf5 60%,#f5f0e0)}
.hero-label{font-size:10px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:8px;opacity:.9}
.hero-title{font-size:26px;font-weight:700;line-height:1.2;margin-bottom:4px;color:var(--text)}
.hero-title em{font-style:normal;color:var(--accent)}
.hero-sub{font-size:12px;color:var(--muted)}

/* NAV */
.nav-wrap{position:sticky;top:0;z-index:100;background:rgba(245,245,240,.97);backdrop-filter:blur(12px);border-bottom:0.5px solid var(--border)}
.nav{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 8px}
.nav::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0;padding:11px 13px 9px;font-size:12px;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:"Noto Sans KR",sans-serif;white-space:nowrap;transition:all .2s}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* SECTION */
.section{display:none;padding:0 16px 20px}
.section.active{display:block}
.sec-title{font-size:18px;font-weight:700;padding:20px 0 14px;color:var(--text)}
.sec-title span{color:var(--accent)}


.main-nav{border-bottom:none!important;padding:0 8px}
.main-btn{font-size:14px!important;font-weight:500!important;padding:12px 20px 10px!important}
.sub-nav{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 8px 0;border-top:0.5px solid var(--border);background:var(--bg3)}
.sub-nav::-webkit-scrollbar{display:none}
.sub-btn{flex-shrink:0;padding:8px 12px;font-size:11px;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:"Noto Sans KR",sans-serif;white-space:nowrap;transition:all .2s}
.sub-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
/* 검색 */
.search-wrap{position:relative;margin-bottom:14px}
.search-input{width:100%;padding:10px 14px 10px 36px;background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;font-size:13px;font-family:"Noto Sans KR",sans-serif;color:var(--text);outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted)}

/* 카드 */
.phrase-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:14px 15px;margin-bottom:8px;cursor:pointer;transition:all .15s;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.phrase-card:active{background:var(--bg3)}
.phrase-card.flipped{background:var(--bg3);border-color:var(--accent)}
.phrase-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.phrase-ko{font-size:14px;font-weight:500;color:var(--text);margin-bottom:3px}
.phrase-jp{font-size:16px;font-weight:700;color:var(--accent)}
.phrase-roma{font-size:11px;color:var(--muted);margin-top:2px}
.phrase-tip{font-size:11px;color:var(--blue);margin-top:6px;padding-top:6px;border-top:0.5px solid var(--border);display:none;line-height:1.6}
.phrase-card.flipped .phrase-tip{display:block}
.flip-hint{font-size:10px;color:var(--muted);flex-shrink:0;margin-top:3px}
.cat-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;margin-bottom:6px;font-weight:500}

/* 플래시카드 모드 */
.flash-wrap{display:none;padding:16px}
.flash-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:16px;padding:40px 24px;text-align:center;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.08);transition:all .2s;margin-bottom:16px}
.flash-card:active{transform:scale(.98)}
.flash-q{font-size:22px;font-weight:700;color:var(--text);margin-bottom:8px}
.flash-hint{font-size:12px;color:var(--muted)}
.flash-a{display:none;margin-top:16px;border-top:0.5px solid var(--border);padding-top:16px;width:100%}
.flash-a.show{display:block}
.flash-jp{font-size:26px;font-weight:700;color:var(--accent);margin-bottom:4px}
.flash-roma{font-size:13px;color:var(--muted)}
.flash-btns{display:flex;gap:8px}
.flash-btn{flex:1;padding:12px;border-radius:10px;border:none;font-size:13px;font-weight:500;cursor:pointer;font-family:"Noto Sans KR",sans-serif;transition:opacity .15s}
.flash-btn:active{opacity:.8}
.flash-progress{text-align:center;font-size:12px;color:var(--muted);margin-bottom:12px}
.flash-prog-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:16px}
.flash-prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}

/* 빈 검색 결과 */
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}

/* 하단 네비 */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(245,245,240,.97);backdrop-filter:blur(16px);border-top:0.5px solid var(--border);display:flex;padding:8px 0 16px;z-index:200}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;font-family:"Noto Sans KR",sans-serif;padding:4px 0}
.bnav-icon{font-size:20px;line-height:1}
.bnav-label{font-size:10px;color:var(--muted);transition:color .2s}
.bnav-btn.active .bnav-label{color:var(--accent)}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-label">Japan Travel</div>
  <div class="hero-title">일본 여행 <em>필수 회화</em></div>
  <div class="hero-sub">카드 탭하면 사용 팁이 나와요 · 플래시카드로 연습도 가능!</div>
</div>

<div class="nav-wrap">
  <!-- 메인 3탭 -->
  <div class="nav main-nav">
    <button class="nav-btn main-btn active" onclick="showMain('phrase',this)">📖 회화</button>
    <button class="nav-btn main-btn" onclick="showMain('word',this)">📝 단어</button>
    <button class="nav-btn main-btn" onclick="showMain('flash',this)">🃏 플래시카드</button>
  </div>
  <!-- 회화 서브탭 -->
  <div class="sub-nav" id="subnav-phrase">
    <button class="sub-btn active" onclick="showTab('all',this,'phrase')">전체</button>
    <button class="sub-btn" onclick="showTab('basic',this,'phrase')">👋 기본인사</button>
    <button class="sub-btn" onclick="showTab('food',this,'phrase')">🍽 식당</button>
    <button class="sub-btn" onclick="showTab('shop',this,'phrase')">🛍 쇼핑</button>
    <button class="sub-btn" onclick="showTab('move',this,'phrase')">🚆 이동</button>
    <button class="sub-btn" onclick="showTab('hotel',this,'phrase')">🏨 숙소</button>
    <button class="sub-btn" onclick="showTab('emergency',this,'phrase')">🚨 긴급</button>
  </div>
  <!-- 단어 서브탭 -->
  <div class="sub-nav" id="subnav-word" style="display:none">
    <button class="sub-btn active" onclick="showTab('wfood',this,'word')">🍜 음식</button>
    <button class="sub-btn" onclick="showTab('wmove',this,'word')">🚇 교통</button>
    <button class="sub-btn" onclick="showTab('wshop',this,'word')">🛍 쇼핑</button>
    <button class="sub-btn" onclick="showTab('wtour',this,'word')">🗺 관광</button>
    <button class="sub-btn" onclick="showTab('wcvs',this,'word')">🏪 편의점</button>
  </div>
</div>

<!-- 전체 / 카테고리 섹션 -->
<div id="tab-all" class="section active">
  <div class="sec-title">전체 <span>회화</span></div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" type="text" placeholder="한국어 또는 일본어로 검색..." oninput="searchPhrases(this.value)" id="searchInput">
  </div>
  <div id="phraseList"></div>
</div>

<div id="tab-basic" class="section">
  <div class="sec-title">기본 <span>인사</span></div>
  <div id="list-basic"></div>
</div>
<div id="tab-food" class="section">
  <div class="sec-title">식당 <span>회화</span></div>
  <div id="list-food"></div>
</div>
<div id="tab-shop" class="section">
  <div class="sec-title">쇼핑 <span>회화</span></div>
  <div id="list-shop"></div>
</div>
<div id="tab-move" class="section">
  <div class="sec-title">이동 <span>회화</span></div>
  <div id="list-move"></div>
</div>
<div id="tab-hotel" class="section">
  <div class="sec-title">숙소 <span>회화</span></div>
  <div id="list-hotel"></div>
</div>
<div id="tab-emergency" class="section">
  <div class="sec-title">긴급 <span>상황</span></div>
  <div id="list-emergency"></div>
</div>


<!-- 단어 탭 섹션 -->
<div id="tab-wfood" class="section">
  <div class="sec-title">음식 <span>단어</span></div>
  <div id="list-wfood"></div>
</div>
<div id="tab-wmove" class="section">
  <div class="sec-title">교통 <span>단어</span></div>
  <div id="list-wmove"></div>
</div>
<div id="tab-wshop" class="section">
  <div class="sec-title">쇼핑 <span>단어</span></div>
  <div id="list-wshop"></div>
</div>
<div id="tab-wtour" class="section">
  <div class="sec-title">관광 <span>단어</span></div>
  <div id="list-wtour"></div>
</div>
<div id="tab-wcvs" class="section">
  <div class="sec-title">편의점 <span>단어</span></div>
  <div id="list-wcvs"></div>
</div>

<!-- 플래시카드 -->
<div id="tab-flash" class="section">
  <div class="sec-title">🃏 <span>플래시카드</span></div>
  <div class="flash-progress" id="flashProgress">0 / 0</div>
  <div class="flash-prog-bar"><div class="flash-prog-fill" id="flashFill" style="width:0%"></div></div>
  <div class="flash-card" id="flashCard" onclick="revealFlash()">
    <div class="flash-q" id="flashQ">탭해서 시작!</div>
    <div class="flash-hint" id="flashHint">한국어를 보고 일본어로 말해보세요</div>
    <div class="flash-a" id="flashA">
      <div class="flash-jp" id="flashJP"></div>
      <div class="flash-roma" id="flashRoma"></div>
    </div>
  </div>
  <div class="flash-btns">
    <button class="flash-btn" style="background:#fde8e8;color:#c0392b" onclick="nextFlash(false)">😅 다시</button>
    <button class="flash-btn" style="background:#e8f5e9;color:#2d8a5e" onclick="nextFlash(true)">✅ 알았어!</button>
  </div>
</div>

<!-- 하단 네비 -->
<div class="bnav">
  <button class="bnav-btn active" onclick="showMain('phrase',this)"><span class="bnav-icon">📖</span><span class="bnav-label">회화</span></button>
  <button class="bnav-btn" onclick="showMain('word',this)"><span class="bnav-icon">📝</span><span class="bnav-label">단어</span></button>
  <button class="bnav-btn" onclick="showMain('flash',this)"><span class="bnav-icon">🃏</span><span class="bnav-label">연습</span></button>
</div>

  var bg = catColors[p.cat] || '#f0f0eb';

    '<div><div class="phrase-ko">'+p.ko+'</div>' +
    '<div class="phrase-jp">'+p.jp+'</div>' +
    '<div class="phrase-roma">'+p.roma+'</div></div>' +
    '<div class="flip-hint">탭 ▼</div></div>' +
    '<div class="phrase-tip">💡 '+p.tip+'</div>' +

}

// 전체 탭 렌더
function renderAll(list) {
  var html = '';
  list.forEach(function(p, i) { html += makeCard(p, i); });
  document.getElementById('phraseList').innerHTML = html || '<div class="empty">검색 결과가 없어요 😅</div>';
}

// 카테고리 탭 렌더
function renderCat(cat) {
  var list = phrases.filter(function(p){ return p.cat === cat; });
  var html = '';
  list.forEach(function(p, i) { html += makeCatCard(p, i); });
  document.getElementById('list-'+cat).innerHTML = html;
}

// 검색
function searchPhrases(q) {
  q = q.trim().toLowerCase();
  var allItems = phrases.concat(words);
  var filtered = q ? allItems.filter(function(p){
    return p.ko.includes(q) || p.jp.includes(q) || p.roma.includes(q);
  }) : allItems;
  renderAll(filtered);
}

// 탭 전환
var TABS = ['all','basic','food','shop','move','hotel','emergency','wfood','wmove','wshop','wtour','wcvs','flash'];
var currentMain = 'phrase';

function showMain(main, btn) {
  currentMain = main;
  // 메인 버튼 active
  document.querySelectorAll('.main-btn').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');
  // 서브탭 보이기/숨기기
  document.getElementById('subnav-phrase').style.display = (main==='phrase') ? 'flex' : 'none';
  document.getElementById('subnav-word').style.display = (main==='word') ? 'flex' : 'none';
  // 해당 메인의 첫 탭으로 이동
  if(main==='phrase') {
    var firstSub = document.querySelector('#subnav-phrase .sub-btn');
    showTab('all', firstSub, 'phrase');
  } else if(main==='word') {
    var firstSub = document.querySelector('#subnav-word .sub-btn');
    showTab('wfood', firstSub, 'word');
  } else if(main==='flash') {
    // 모든 섹션 숨기기
    TABS.forEach(function(t){
      var el = document.getElementById('tab-'+t);
      if(el) el.style.display = 'none';
    });
    document.getElementById('tab-flash').style.display = 'block';
    document.getElementById('subnav-phrase').style.display = 'none';
    document.getElementById('subnav-word').style.display = 'none';
    initFlash();
  }
  // 하단 버튼 동기화
  document.querySelectorAll('.bnav-btn').forEach(function(b){ b.classList.remove('active'); });
  var bnavMap = {'phrase':0, 'word':1, 'flash':4};
  var bb = document.querySelectorAll('.bnav-btn');
  if(bnavMap[main] !== undefined && bb[bnavMap[main]]) bb[bnavMap[main]].classList.add('active');
}
function showTab(id, btn) {
  TABS.forEach(function(t){
    var el = document.getElementById('tab-'+t);
    if(el) el.style.display = (t===id) ? 'block' : 'none';
  });
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
  document.querySelectorAll('.bnav-btn').forEach(function(b){ b.classList.remove('active'); });
  if(btn) {
    btn.classList.add('active');
    var idx = TABS.indexOf(id);
    var nb = document.querySelectorAll('.nav-btn');
    if(nb[idx]) nb[idx].classList.add('active');
    var bb = document.querySelectorAll('.bnav-btn');
    // 하단 버튼 동기화
    var bnavMap = {all:0, food:1, move:2, shop:3, flash:4};
    if(bnavMap[id] !== undefined && bb[bnavMap[id]]) bb[bnavMap[id]].classList.add('active');
  }
  if(id === 'flash') initFlash();
  document.querySelector('.nav-wrap').scrollIntoView({behavior:'smooth', block:'start'});
}

// 플래시카드
var flashList = [], flashIdx = 0, flashCorrect = 0, flashRevealed = false;
function initFlash() {
  flashList = phrases.concat(words).slice().sort(function(){ return Math.random()-.5; });
  flashIdx = 0; flashCorrect = 0;
  updateFlash();
}
function updateFlash() {
  if(flashIdx >= flashList.length) {
    document.getElementById('flashQ').textContent = '🎉 완료! ' + flashCorrect + '/' + flashList.length + '개 맞았어요!';
    document.getElementById('flashHint').textContent = '다시 시작하려면 탭하세요';
    document.getElementById('flashA').classList.remove('show');
    document.getElementById('flashFill').style.width = '100%';
    document.getElementById('flashProgress').textContent = flashList.length + ' / ' + flashList.length;
    flashRevealed = false;
    document.getElementById('flashCard').onclick = function(){ initFlash(); };
    return;
  }
  var p = flashList[flashIdx];
  document.getElementById('flashQ').textContent = p.ko;
  document.getElementById('flashHint').textContent = p.icon + ' ' + catNames[p.cat] + ' · 탭해서 정답 확인';
  document.getElementById('flashJP').textContent = p.jp;
  document.getElementById('flashRoma').textContent = p.roma;
  document.getElementById('flashA').classList.remove('show');
  document.getElementById('flashFill').style.width = (flashIdx / flashList.length * 100) + '%';
  document.getElementById('flashProgress').textContent = (flashIdx+1) + ' / ' + flashList.length;
  flashRevealed = false;
  document.getElementById('flashCard').onclick = revealFlash;
}
function revealFlash() {
  if(flashRevealed) return;
  document.getElementById('flashA').classList.add('show');
  flashRevealed = true;
}
function nextFlash(correct) {
  if(!flashRevealed) { revealFlash(); return; }
  if(correct) flashCorrect++;
  flashIdx++;
  updateFlash();
}

// 초기화
TABS.forEach(function(t){
  var el = document.getElementById('tab-'+t);
  if(el) el.style.display = (t==='all') ? 'block' : 'none';
});
renderAll(phrases);
['basic','food','shop','move','hotel','emergency'].forEach(function(cat){ renderCat(cat); });
['wfood','wmove','wshop','wtour','wcvs'].forEach(function(cat){ renderWords(cat); });
initFlash();
